services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE: /data/tracker.sqlite3
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - tracker-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tracker-data:

