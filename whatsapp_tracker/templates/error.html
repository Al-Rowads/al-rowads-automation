<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="error-page">
  <main class="panel error-card">
    <p class="error-symbol" aria-hidden="true">!</p>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <button class="button button-primary" type="button" onclick="window.close()">إغلاق النافذة</button>
  </main>
</body>
</html>
